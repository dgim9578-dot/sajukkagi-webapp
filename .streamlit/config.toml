# Streamlit 1.38+ 테마: 앱 우상단 ⋮ → Settings → Theme 에서 Light / Dark 전환
# https://docs.streamlit.io/develop/concepts/configuration/theming
#
# 다크 프리미엄: 고급 한지 + 금박 + Deep Dark
# 배경 #0A0A14 · 카드 그라데이션은 bootstrap CSS · 악센트 #D4AF37 / #E8B923
# 본문 #E5E5E5 · 보조 강조 #A5B4FC (링크에 사용)

[theme.light]
# 라이트: 웜 아이보리 캔버스 + 골드 액센트 (노이즈·한지 질감 없이 가독성 우선)
primaryColor = "#C9A227"
backgroundColor = "#FAF8F5"
secondaryBackgroundColor = "#F3EFE8"
textColor = "#1C1510"
linkColor = "#8A6D1A"

[theme.dark]
primaryColor = "#D4AF37"
backgroundColor = "#0A0A12"
secondaryBackgroundColor = "#141422"
textColor = "#E5E5E5"
linkColor = "#A5B4FC"

# 상단 Fork·햄버거·Deploy·왕관(관리) 등 플랫폼 UI 최소화 (앱 기능과 무관)
[client]
toolbarMode = "minimal"

# PWA: ``app.py`` 옆 ``static/`` → 브라우저에서는 ``/app/static/...`` (Streamlit 공식 경로)
[server]
# LAN 접속(로컬): 터미널에서 ``set STREAMLIT_SERVER_ADDRESS=0.0.0.0`` 후 실행.
# Cloud 에서 address=0.0.0.0 을 두면 static 서빙이 깨질 수 있어 config 에 넣지 않는다.
enableStaticServing = true
